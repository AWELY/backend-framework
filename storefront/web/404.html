  <title>الصفحة غير موجودة | AMA</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <!--
    صفحة "غير موجودة". يرسلها web-server.js برمز 404 لأي ملف غير موجود، مهما كان عمق الرابط.
    لهذا روابطها تبدأ بـ "/" (مثل /css/styles.css) وليست نسبية: لو طُلب /a/b/c، لبحث الرابط
    النسبي css/styles.css في /a/b/css/ ولم يجده. وهي صفحة ثابتة بلا سكربت ولا اتصال بالـ API.
  -->

  <main class="container">
    <div class="empty">
      <div class="big">الصفحة غير موجودة</div>
      <p>ربما تغيّر الرابط أو كُتب بشكل خاطئ.</p>
      <a class="btn" href="/index.html">العودة للرئيسية</a>
    </div>
  </main>
</body>
</html>
