<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>متجر ماء | إلكترونيات وإكسسوارات الهواتف</title>
  <meta name="description" content="Maa - إلكترونيات وإكسسوارات الهواتف في طرابلس، تاجوراء. توصيل لكل المدن الليبية والدفع عند الاستلام.">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!--
    الصفحة الرئيسية. كل صفحات الموقع "هياكل" صغيرة بهذا الشكل، لا تحتوي المحتوى نفسه:
      - main#app: المكان الذي يرسم فيه السكربت محتوى الصفحة، ويظهر فيه "جاري التحميل..." حتى يصل.
      - سكربت واحد خاص بالصفحة (هنا js/pages/home.js): يطلب البيانات من الـ API ويبني الصفحة،
        ويضيف الرأس والتذييل المشتركين (mountLayout في js/ui.js).
    نوع السكربت module يسمح له باستيراد ملفات أخرى، ويؤجل تشغيله حتى تكتمل قراءة الصفحة.
    لا يوجد سكربت ولا تنسيق مكتوب داخل HTML نفسه: سياسة أمان المحتوى (CSP) تمنع ذلك.

    وفي رأس الصفحة:
      - اللغة عربية والاتجاه من اليمين (خاصيتا lang و dir)، يستفيد منهما المتصفح وقارئ الشاشة.
      - viewport يجعل الصفحة بعرض شاشة الهاتف بدل تصغير صفحة حاسوب.
      - description هو الوصف الذي تعرضه محركات البحث.
      - preconnect يبدأ الاتصال بخوادم Google Fonts مبكراً، فيصل خط Cairo أسرع.
  -->

  <main class="container" id="app">
    <div class="loading">جاري التحميل...</div>
  </main>
  <script type="module" src="js/pages/home.js"></script>
</body>
</html>
